<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 - 页面未找到</title>
<style>
:root {
  --blue:#007aff; --blue2:#34c9ff;
  --text:#1e1e1e; --muted:#8a8a8a;
}
body {
  margin:0;
  height:100vh;
  background: radial-gradient(circle at 30% 30%, #eaf4ff 0%, #f9fbff 40%, #f7f7f7 100%);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", Arial;
  color: var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  flex-direction:column;
  text-align:center;
}
h1 {
  font-size: 120px;
  font-weight: 800;
  margin: 0;
  background: linear-gradient(135deg, var(--blue), var(--blue2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 6px;
  animation: float 3s ease-in-out infinite;
}
@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}
h2 {
  margin-top: -10px;
  font-size: 22px;
  font-weight: 600;
  color: var(--blue);
}
p {
  color: var(--muted);
  font-size: 16px;
  margin: 10px 0 20px;
}
button {
  background: linear-gradient(145deg, var(--blue), var(--blue2));
  border: none;
  color: white;
  padding: 12px 32px;
  border-radius: 22px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s ease;
  box-shadow: 0 8px 20px rgba(0,122,255,0.25);
}
button:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 26px rgba(0,122,255,0.35);
}
canvas {
  position: fixed;
  inset: 0;
  z-index: -1;
}
</style>
</head>
<body>
<canvas id="bg"></canvas>

<h1>404</h1>
<h2>哎呀，页面走丢了 🚀</h2>
<p>可能链接已过期，或你访问的页面不存在。</p>
<button onclick="window.location.href='/index.html'">🏠 返回首页</button>

<script>
// 背景粒子特效（与压测页呼应）
const c=document.getElementById("bg"),ctx=c.getContext("2d");
let w,h,particles=[];
function resize(){w=c.width=innerWidth;h=c.height=innerHeight;}resize();
window.onresize=resize;
for(let i=0;i<80;i++)particles.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*0.6,vy:(Math.random()-.5)*0.6,size:Math.random()*2.5});
function draw(){
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle="rgba(52,201,255,0.3)";
  for(const p of particles){
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,2*Math.PI);ctx.fill();
  }
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
